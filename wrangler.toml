#:schema node_modules/wrangler/config-schema.json
name = "cipowell"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_flags = [
    "nodejs_compat"
]
compatibility_date = "2025-09-01"
preview_urls = true

# Required by Workers Builds to create/update PR previews (`wrangler preview`).
# Can be empty; assets, compatibility settings, migrations, and placement
# stay at the top level. See https://developers.cloudflare.com/workers/previews/configuration/#wrangler-configuration-file
[previews]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

######## PREVIEW environment config ########
# Preview mode uses the Contentful Preview API to show draft content
# Set CONTENTFUL_PREVIEW_API_KEY secret to use a preview-specific token
# If not set, falls back to CONTENTFUL_API_KEY
# Top-level settings like `preview_urls` are not inherited by named
# environments, so Workers Builds needs it redeclared here for PR previews.

[env.preview]
preview_urls = true

[env.preview.vars]
CONTENTFUL_ENVIRONMENT = "preview"

######## PRODUCTION environment config ########

[env.production.vars]
