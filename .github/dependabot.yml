version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
    groups:
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
          - 'eslint-plugin-storybook'
      svelte:
        patterns:
          - 'svelte'
          - '@sveltejs/*'
          - 'vite'
      contentful:
        patterns:
          - '@contentful/*'
          - 'contentful'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      playwright:
        patterns:
          - 'playwright'
          - '@playwright/*'
      eslint:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'eslint-config-*'
          - 'eslint-plugin-*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
        exclude-patterns:
          - 'eslint-plugin-storybook'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
      - 'github-actions'
